<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="t d"><title id="t">Две полосы поверх одной политики</title><desc id="d">Немедленная полоса отдаёт ответ или исключение в пределах вызова; долговечная пишет запись в хранилище и доставляет её позже. Обе спрашивают одну политику повторов; хранилище, транспорт, диспетчер, формат, часы и журнал — порты.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#131a33"/></linearGradient><linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cff7a"/><stop offset="1" stop-color="#2fbf4a"/></linearGradient><linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7defff"/><stop offset="1" stop-color="#1b9fc0"/></linearGradient><linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c3a8ff"/><stop offset="1" stop-color="#6c4be0"/></linearGradient><linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc27a"/><stop offset="1" stop-color="#e8661e"/></linearGradient><radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38d6e8" stop-opacity="0.35"/><stop offset="1" stop-color="#38d6e8" stop-opacity="0"/></radialGradient><radialGradient id="haloP" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#a07bff" stop-opacity="0.30"/><stop offset="1" stop-color="#a07bff" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32,0 L0,0 L0,32" fill="none" stroke="#1c2547" stroke-width="1"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6cf"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5ee05a"/></marker><marker id="arrC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38d6e8"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9548"/></marker><marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a07bff"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6fa8"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="0" y="0" width="1280" height="660" rx="18" fill="url(#bg)"/>
<rect x="0.75" y="0.75" width="1278.5" height="658.5" rx="17.5" fill="none" stroke="#2c3868" stroke-width="1.5"/>
<text x="40" y="48" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#eef2ff" text-anchor="start">Две полосы поверх одной политики</text>
<text x="1240" y="48" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa6cf" text-anchor="end">о вашем сервере библиотека не знает: всё внешнее — порты</text>
<rect x="40" y="76" width="580" height="312" rx="16" fill="#121a38" stroke="#38d6e8" stroke-width="2"/>
<text x="62" y="110" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#38d6e8" text-anchor="start">Немедленная полоса</text>
<text x="62" y="134" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#eef2ff" text-anchor="start">ImmediateLane.SendAsync(QueueRequest)</text>
<rect x="62" y="152" width="126" height="50" rx="10" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<text x="125.0" y="173" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#eef2ff" text-anchor="middle">SendAsync</text>
<text x="125.0" y="191" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle">вызывающий ждёт</text>
<line x1="191" y1="177" x2="198" y2="177" stroke="#38d6e8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrC)"/>
<rect x="201" y="152" width="126" height="50" rx="10" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<text x="264.0" y="173" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#eef2ff" text-anchor="middle">IQueueTransport</text>
<text x="264.0" y="191" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle">отправка</text>
<line x1="330" y1="177" x2="337" y2="177" stroke="#38d6e8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrC)"/>
<rect x="340" y="152" width="126" height="50" rx="10" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<text x="403.0" y="173" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#eef2ff" text-anchor="middle">политика</text>
<text x="403.0" y="191" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle">решает исход</text>
<line x1="469" y1="177" x2="476" y2="177" stroke="#38d6e8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrC)"/>
<rect x="479" y="152" width="126" height="50" rx="10" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<text x="542.0" y="173" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#eef2ff" text-anchor="middle">ответ</text>
<text x="542.0" y="191" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle">или исключение</text>
<text x="62" y="236" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">Когда: </tspan><tspan fill="#9aa6cf" font-weight="400">ответ нужен сейчас и потеря терпима</tspan></text>
<text x="62" y="258" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">После перезапуска: </tspan><tspan fill="#9aa6cf" font-weight="400">ничего не остаётся</tspan></text>
<text x="62" y="280" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">Повторы: </tspan><tspan fill="#9aa6cf" font-weight="400">внутри одного вызова, по умолчанию до 4</tspan></text>
<text x="62" y="302" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">Обрыв связи: </tspan><tspan fill="#9aa6cf" font-weight="400">тоже тратит попытку — вызывающий ждёт</tspan></text>
<text x="62" y="324" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">Отказ: </tspan><tspan fill="#9aa6cf" font-weight="400">QueueRequestFailedException, а не пустота</tspan></text>
<text x="62" y="346" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">Suspend: </tspan><tspan fill="#9aa6cf" font-weight="400">не назначается, превращается в видимую ошибку</tspan></text>
<rect x="660" y="76" width="580" height="312" rx="16" fill="#121a38" stroke="#5ee05a" stroke-width="2"/>
<text x="682" y="110" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="19" font-weight="800" fill="#5ee05a" text-anchor="start">Долговечная полоса</text>
<text x="682" y="134" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#eef2ff" text-anchor="start">DurableLane&lt;T&gt;.Enqueue(…)  ·  PumpAsync()</text>
<rect x="682" y="152" width="126" height="50" rx="10" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<text x="745.0" y="173" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#eef2ff" text-anchor="middle">Enqueue</text>
<text x="745.0" y="191" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle">синхронно, без сети</text>
<line x1="811" y1="177" x2="818" y2="177" stroke="#5ee05a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrG)"/>
<rect x="821" y="152" width="126" height="50" rx="10" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<text x="884.0" y="173" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#eef2ff" text-anchor="middle">IQueueStorage</text>
<text x="884.0" y="191" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle">запись до сети</text>
<line x1="950" y1="177" x2="957" y2="177" stroke="#5ee05a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrG)"/>
<rect x="960" y="152" width="126" height="50" rx="10" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<text x="1023.0" y="173" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#eef2ff" text-anchor="middle">PumpAsync</text>
<text x="1023.0" y="191" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle">из игрового цикла</text>
<line x1="1089" y1="177" x2="1096" y2="177" stroke="#5ee05a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrG)"/>
<rect x="1099" y="152" width="126" height="50" rx="10" fill="#171f3b" stroke="#2c3868" stroke-width="1.5"/>
<text x="1162.0" y="173" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#eef2ff" text-anchor="middle">IQueueDispatcher</text>
<text x="1162.0" y="191" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="middle">доставка пачкой</text>
<text x="682" y="236" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">Когда: </tspan><tspan fill="#9aa6cf" font-weight="400">ответ не нужен сейчас или потеря недопустима</tspan></text>
<text x="682" y="258" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">После перезапуска: </tspan><tspan fill="#9aa6cf" font-weight="400">запись на носителе, nextAttemptAt в ней</tspan></text>
<text x="682" y="280" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">Повторы: </tspan><tspan fill="#9aa6cf" font-weight="400">по умолчанию до 12 попыток, срок жизни 7 дней</tspan></text>
<text x="682" y="302" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">Обрыв связи: </tspan><tspan fill="#9aa6cf" font-weight="400">двигает бэкофф, потолок попыток не тратит</tspan></text>
<text x="682" y="324" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">Исчерпание: </tspan><tspan fill="#9aa6cf" font-weight="400">строка в dead-letter + событие Incident</tspan></text>
<text x="682" y="346" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">Suspend: </tspan><tspan fill="#9aa6cf" font-weight="400">пауза всей полосы до 10 мин, без потерь</tspan></text>
<line x1="330.0" y1="392" x2="330.0" y2="427" stroke="#38d6e8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrC)"/>
<line x1="950.0" y1="392" x2="950.0" y2="427" stroke="#5ee05a" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrG)"/>
<text x="340.0" y="414" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="start">QueueAttempt</text>
<text x="960.0" y="414" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#9aa6cf" text-anchor="start">QueueAttempt</text>
<rect x="40" y="430" width="1200" height="118" rx="16" fill="#0f1530" stroke="#ff9548" stroke-width="1.8"/>
<text x="62" y="462" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#ff9548" font-weight="800">Одна политика  </tspan><tspan fill="#eef2ff" font-weight="400" font-family="Cascadia Code, Consolas, Menlo, monospace">IQueueRetryPolicy.Decide(QueueAttempt)</tspan><tspan fill="#9aa6cf" font-weight="400">  — коды вашего сервера классифицирует она, у библиотеки своего списка нет</tspan></text>
<rect x="62" y="476" width="62.0" height="30" rx="15.0" fill="#1d2750" stroke="#5ee05a" stroke-width="1.5"/>
<text x="93.0" y="495.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#eef2ff" text-anchor="middle">Done</text>
<rect x="134.0" y="476" width="272.0" height="30" rx="15.0" fill="#1d2750" stroke="#ff9548" stroke-width="1.5"/>
<text x="270.0" y="495.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#eef2ff" text-anchor="middle">RetryLater(delay, spendsAttempt)</text>
<rect x="416.0" y="476" width="122.0" height="30" rx="15.0" fill="#1d2750" stroke="#ff6fa8" stroke-width="1.5"/>
<text x="477.0" y="495.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#eef2ff" text-anchor="middle">Drop(reason)</text>
<rect x="548.0" y="476" width="144.5" height="30" rx="15.0" fill="#1d2750" stroke="#a07bff" stroke-width="1.5"/>
<text x="620.25" y="495.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#eef2ff" text-anchor="middle">Suspend(reason)</text>
<text x="62" y="530" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#eef2ff" font-weight="700">QueueBackoff: </tspan><tspan fill="#eef2ff" font-weight="400" font-family="Cascadia Code, Consolas, Menlo, monospace">delay = rand(0, min(base · 2ⁿ, cap))</tspan><tspan fill="#9aa6cf" font-weight="400">  — экспонента с полным джиттером; по умолчанию base = 2 с, cap = 15 мин</tspan></text>
<text x="40" y="586" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#5ee05a" text-anchor="start">ПОРТЫ — реализует приложение</text>
<rect x="40" y="598" width="129.5" height="30" rx="15.0" fill="#1d2750" stroke="#5ee05a" stroke-width="1.5"/>
<text x="104.75" y="617.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#eef2ff" text-anchor="middle">IQueueStorage</text>
<rect x="179.5" y="598" width="144.5" height="30" rx="15.0" fill="#1d2750" stroke="#5ee05a" stroke-width="1.5"/>
<text x="251.75" y="617.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#eef2ff" text-anchor="middle">IQueueTransport</text>
<rect x="334.0" y="598" width="174.5" height="30" rx="15.0" fill="#1d2750" stroke="#5ee05a" stroke-width="1.5"/>
<text x="421.25" y="617.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#eef2ff" text-anchor="middle">IQueueDispatcher&lt;T&gt;</text>
<rect x="518.5" y="598" width="159.5" height="30" rx="15.0" fill="#1d2750" stroke="#5ee05a" stroke-width="1.5"/>
<text x="598.25" y="617.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="600" fill="#eef2ff" text-anchor="middle">IQueueRetryPolicy</text>
<text x="702.0" y="586" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#9aa6cf" text-anchor="start">НЕОБЯЗАТЕЛЬНЫЕ, есть умолчания</text>
<rect x="702.0" y="598" width="137.0" height="30" rx="15.0" fill="#1d2750" stroke="#2c3868" stroke-width="1.5"/>
<text x="770.5" y="617.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#eef2ff" text-anchor="middle">IQueueCodec&lt;T&gt;</text>
<rect x="849.0" y="598" width="114.5" height="30" rx="15.0" fill="#1d2750" stroke="#2c3868" stroke-width="1.5"/>
<text x="906.25" y="617.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#eef2ff" text-anchor="middle">IQueueClock</text>
<rect x="973.5" y="598" width="99.5" height="30" rx="15.0" fill="#1d2750" stroke="#2c3868" stroke-width="1.5"/>
<text x="1023.25" y="617.5" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="12.5" font-weight="400" fill="#eef2ff" text-anchor="middle">IQueueLog</text>
</svg>
